<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e3a8a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #e2e8f0;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border-radius: 1.5rem;
        }

        /* Neon Progress Bar */
        .progress-glow {
            box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            transition: width 0.5s ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* Custom Checkbox */
        .task-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #60a5fa;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .task-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .task-checkbox:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            color: white;
            font-size: 12px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .task-text {
            transition: all 0.3s;
        }
        .task-checkbox:checked + .task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .tab-active {
            border-bottom: 2px solid #60a5fa;
            color: #60a5fa;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/95 backdrop-blur-xl transition-opacity duration-700">
        <div class="glass-card w-full max-w-lg p-10 flex flex-col items-center text-center transform scale-100 transition-transform duration-700" id="splash-card">
            <i class="fas fa-quote-left text-4xl text-blue-400 mb-6 opacity-50"></i>
            <p id="quote-text" class="text-xl md:text-2xl font-medium text-gray-200 mb-10 leading-relaxed italic"></p>
            <button onclick="startApp()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.6)] hover:shadow-[0_0_25px_rgba(37,99,235,0.9)] transition-all transform hover:scale-105 flex items-center">
                Start your day <i class="fas fa-rocket ml-3"></i>
            </button>
        </div>
    </div>

    <div class="glass-card w-full max-w-md p-6 h-[85vh] flex flex-col relative overflow-hidden">
        
        <!-- Header & Tabs -->
        <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
            <button id="tab-today" class="tab-active flex-1 text-center pb-2 font-semibold transition-all" onclick="switchTab('today')">Today</button>
            <button id="tab-timer" class="flex-1 text-center pb-2 font-semibold text-gray-400 hover:text-gray-200 transition-all border-b-2 border-transparent" onclick="switchTab('timer')">Timer</button>
            <button id="tab-history" class="flex-1 text-center pb-2 font-semibold text-gray-400 hover:text-gray-200 transition-all border-b-2 border-transparent" onclick="switchTab('history')">History</button>
        </div>

        <!-- TODAY VIEW -->
        <div id="view-today" class="flex-1 flex flex-col overflow-hidden">
            
            <!-- Progress Section -->
            <div class="mb-6">
                <div class="flex justify-between text-sm mb-2">
                    <span>Daily Progress</span>
                    <span id="progress-text" class="font-bold text-blue-400">0%</span>
                </div>
                <div class="w-full bg-white/10 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full progress-glow" style="width: 0%"></div>
                </div>
            </div>

            <!-- Categories Scrollable Area -->
            <div class="flex-1 overflow-y-auto pr-2 pb-4 space-y-6" id="categories-container">
                <!-- Spiritual -->
                <div>
                    <h3 class="text-sm font-semibold text-purple-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fas fa-om"></i> Spiritual Health
                    </h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="input-spiritual" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400 text-white placeholder-gray-400" placeholder="Add a task (e.g., Meditate 10 mins)..." onkeypress="handleEnter(event, 'spiritual')">
                        <button onclick="addTask('spiritual')" class="bg-purple-500/20 hover:bg-purple-500/40 text-purple-300 px-3 py-1.5 rounded-lg transition-colors"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="list-spiritual" class="space-y-2"></div>
                </div>

                <!-- Physical -->
                <div>
                    <h3 class="text-sm font-semibold text-green-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fas fa-dumbbell"></i> Physical Health
                    </h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="input-physical" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400 text-white placeholder-gray-400" placeholder="Add a task (e.g., 100m sprint drill)..." onkeypress="handleEnter(event, 'physical')">
                        <button onclick="addTask('physical')" class="bg-green-500/20 hover:bg-green-500/40 text-green-300 px-3 py-1.5 rounded-lg transition-colors"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="list-physical" class="space-y-2"></div>
                </div>

                <!-- Studies -->
                <div>
                    <h3 class="text-sm font-semibold text-blue-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fas fa-book-open"></i> Studies
                    </h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="input-studies" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400 text-white placeholder-gray-400" placeholder="Add a task (e.g., AU IT Assignment)..." onkeypress="handleEnter(event, 'studies')">
                        <button onclick="addTask('studies')" class="bg-blue-500/20 hover:bg-blue-500/40 text-blue-300 px-3 py-1.5 rounded-lg transition-colors"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="list-studies" class="space-y-2"></div>
                </div>

                <!-- Startup -->
                <div>
                    <h3 class="text-sm font-semibold text-orange-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fas fa-rocket"></i> Startup
                    </h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="input-startup" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400 text-white placeholder-gray-400" placeholder="Add a task (e.g., Check Amazon margins)..." onkeypress="handleEnter(event, 'startup')">
                        <button onclick="addTask('startup')" class="bg-orange-500/20 hover:bg-orange-500/40 text-orange-300 px-3 py-1.5 rounded-lg transition-colors"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="list-startup" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <!-- TIMER VIEW -->
        <div id="view-timer" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <div class="flex flex-col items-center justify-center mb-6 mt-4">
                <div id="timer-display" class="text-6xl font-bold text-blue-400 mb-6 drop-shadow-[0_0_10px_rgba(59,130,246,0.8)] font-mono">00:00:00</div>

                <div id="timer-inputs" class="flex gap-4 mb-6">
                    <div class="flex flex-col items-center">
                        <input type="number" id="input-hours" min="0" placeholder="00" class="w-16 bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-center text-xl focus:outline-none focus:border-blue-400 text-white">
                        <span class="text-xs text-gray-400 mt-1">Hours</span>
                    </div>
                    <div class="text-2xl font-bold text-white/50 pt-2">:</div>
                    <div class="flex flex-col items-center">
                        <input type="number" id="input-minutes" min="0" max="59" placeholder="00" class="w-16 bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-center text-xl focus:outline-none focus:border-blue-400 text-white">
                        <span class="text-xs text-gray-400 mt-1">Minutes</span>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="btn-start" onclick="startTimer()" class="bg-blue-500/20 hover:bg-blue-500/40 text-blue-300 px-6 py-2.5 rounded-lg transition-colors font-medium"><i class="fas fa-play mr-1"></i> Start</button>
                    <button id="btn-pause" onclick="pauseTimer()" class="hidden bg-yellow-500/20 hover:bg-yellow-500/40 text-yellow-300 px-6 py-2.5 rounded-lg transition-colors font-medium"><i class="fas fa-pause mr-1"></i> Pause</button>
                    <button onclick="resetTimer()" class="bg-red-500/20 hover:bg-red-500/40 text-red-300 px-6 py-2.5 rounded-lg transition-colors font-medium"><i class="fas fa-redo mr-1"></i> Reset</button>
                </div>
            </div>

            <div class="border-t border-white/10 pt-4 flex-1 flex flex-col min-h-0">
                <h3 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-3 flex justify-between items-center">
                    <span><i class="fas fa-history"></i> Timer Logs</span>
                </h3>
                <div class="flex-1 overflow-y-auto pr-2 pb-4 space-y-2" id="timer-history-list">
                    <!-- Timer logs injected here -->
                </div>
            </div>
        </div>

        <!-- HISTORY VIEW -->
        <div id="view-history" class="hidden flex-1 flex flex-col h-full">
            <h2 class="text-lg font-semibold mb-4 text-center">Last 7 Days Progress</h2>
            <div class="flex-1 flex items-center justify-center bg-white/5 rounded-xl p-4 border border-white/10">
                <canvas id="historyChart"></canvas>
            </div>
            <p class="text-xs text-center text-gray-400 mt-4">Graph updates daily based on your completed tasks.</p>
        </div>

    </div>

    <script>
        // State Management
        let tasks = JSON.parse(localStorage.getItem('myGoalsTasks')) || {
            spiritual: [], physical: [], studies: [], startup: []
        };
        
        let historyData = JSON.parse(localStorage.getItem('myGoalsHistory')) || [
            { date: 'Mon', score: 60 }, { date: 'Tue', score: 75 },
            { date: 'Wed', score: 50 }, { date: 'Thu', score: 90 },
            { date: 'Fri', score: 85 }, { date: 'Sat', score: 100 },
            { date: 'Today', score: 0 }
        ];

        let timerHistoryData = JSON.parse(localStorage.getItem('myTimerHistory')) || [];

        let myChart = null;
        let timerInterval;
        let totalSeconds = 0;
        let originalSeconds = 0;
        let isPaused = false;

        const motivationQuotes = [
            "The secret of getting ahead is getting started.",
            "Don't stop when you're tired. Stop when you're done.",
            "Wake up with determination. Go to bed with satisfaction.",
            "Do something today that your future self will thank you for.",
            "Little by little, one travels far.",
            "It's going to be hard, but hard does not mean impossible.",
            "Don't wait for opportunity. Create it.",
            "Success is not final, failure is not fatal: it is the courage to continue that counts.",
            "Focus on being productive instead of busy.",
            "Small daily improvements over time lead to stunning results."
        ];

        // Initialize App
        function init() {
            setupSplashScreen();
            renderAllTasks();
            updateProgress();
            checkNewDay();
            renderTimerHistory();
        }

        // Splash Screen Logic
        function setupSplashScreen() {
            const todayStr = new Date().toDateString();
            const savedQuoteDate = localStorage.getItem('myGoalsQuoteDate');
            let dailyQuote = localStorage.getItem('myGoalsDailyQuote');

            // If it's a new day or no quote exists, pick a new one and save it
            if (savedQuoteDate !== todayStr || !dailyQuote) {
                dailyQuote = motivationQuotes[Math.floor(Math.random() * motivationQuotes.length)];
                localStorage.setItem('myGoalsQuoteDate', todayStr);
                localStorage.setItem('myGoalsDailyQuote', dailyQuote);
            }

            document.getElementById('quote-text').innerText = `"${dailyQuote}"`;
        }

        function startApp() {
            const splash = document.getElementById('splash-screen');
            const splashCard = document.getElementById('splash-card');
            
            // Add a little pop effect to the card while fading out the background
            splashCard.style.transform = 'scale(0.95)';
            splash.style.opacity = '0';
            
            setTimeout(() => {
                splash.style.display = 'none';
            }, 700);
        }

        // Tab Switching
        function switchTab(tab) {
            const tabs = ['today', 'timer', 'history'];
            tabs.forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
                const tabBtn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    tabBtn.className = "tab-active flex-1 text-center pb-2 font-semibold transition-all";
                } else {
                    tabBtn.className = "flex-1 text-center pb-2 font-semibold text-gray-400 hover:text-gray-200 transition-all border-b-2 border-transparent";
                }
            });
            
            if (tab === 'history') {
                renderChart();
            }
        }

        // Handle Enter Key
        function handleEnter(e, category) {
            if (e.key === 'Enter') addTask(category);
        }

        // Add Task
        function addTask(category) {
            const inputField = document.getElementById(`input-${category}`);
            const text = inputField.value.trim();
            
            if (text === '') return;

            tasks[category].push({ id: Date.now(), text: text, completed: false });
            inputField.value = '';
            
            saveData();
            renderAllTasks();
            updateProgress();
        }

        // Toggle Checkbox
        function toggleTask(category, id) {
            const task = tasks[category].find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData();
                updateProgress();
                renderAllTasks();
            }
        }

        // Delete Task
        function deleteTask(category, id) {
            tasks[category] = tasks[category].filter(t => t.id !== id);
            saveData();
            renderAllTasks();
            updateProgress();
        }

        // Render Tasks to DOM
        function renderAllTasks() {
            ['spiritual', 'physical', 'studies', 'startup'].forEach(category => {
                const listEl = document.getElementById(`list-${category}`);
                listEl.innerHTML = '';
                
                if (tasks[category].length === 0) {
                    listEl.innerHTML = `<p class="text-xs text-gray-500 italic">No tasks added yet.</p>`;
                    return;
                }

                tasks[category].forEach(task => {
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between bg-white/5 p-3 rounded-lg border border-white/5 hover:bg-white/10 transition-colors";
                    item.innerHTML = `
                        <label class="flex items-center gap-3 cursor-pointer flex-1">
                            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${category}', ${task.id})">
                            <span class="task-text text-sm select-none ${task.completed ? 'text-gray-400' : 'text-gray-100'}">${task.text}</span>
                        </label>
                        <button onclick="deleteTask('${category}', ${task.id})" class="text-gray-500 hover:text-red-400 ml-2 transition-colors">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    listEl.appendChild(item);
                });
            });
        }

        // Calculate and Update Progress
        function updateProgress() {
            let total = 0;
            let completed = 0;

            Object.values(tasks).forEach(cat => {
                total += cat.length;
                completed += cat.filter(t => t.completed).length;
            });

            let percent = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${percent}%`;

            // Update Today's score in history
            historyData[historyData.length - 1].score = percent;
            localStorage.setItem('myGoalsHistory', JSON.stringify(historyData));
            
            // Adjust glow color based on completion
            const bar = document.getElementById('progress-bar');
            if (percent === 100) {
                bar.style.backgroundColor = '#10b981'; // Green
                bar.style.boxShadow = '0 0 10px #10b981, 0 0 20px #10b981';
            } else {
                bar.style.backgroundColor = '#3b82f6'; // Blue
                bar.style.boxShadow = '0 0 10px #3b82f6, 0 0 20px #3b82f6';
            }
        }

        // Save to Local Storage
        function saveData() {
            localStorage.setItem('myGoalsTasks', JSON.stringify(tasks));
        }

        // Dummy logic to simulate daily reset (can be expanded for real dates)
        function checkNewDay() {
            const lastDate = localStorage.getItem('myGoalsLastDate');
            const todayStr = new Date().toDateString();

            if (lastDate && lastDate !== todayStr) {
                // It's a new day, shift history left
                const yesterdayScore = historyData[historyData.length - 1].score;
                historyData.shift(); // remove oldest
                
                // Format yesterday's day name
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const yesterdayDay = days[new Date(lastDate).getDay()];
                
                historyData[historyData.length - 1].date = yesterdayDay;
                historyData.push({ date: 'Today', score: 0 }); // Add new today

                // Uncheck all tasks
                Object.keys(tasks).forEach(cat => {
                    tasks[cat].forEach(t => t.completed = false);
                });

                saveData();
                localStorage.setItem('myGoalsHistory', JSON.stringify(historyData));
                renderAllTasks();
                updateProgress();
            }
            localStorage.setItem('myGoalsLastDate', todayStr);
        }

        /* --- TIMER TAB LOGIC --- */
        function updateTimerDisplay() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            document.getElementById('timer-display').innerText =
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (!isPaused && totalSeconds === 0) {
                const hrs = parseInt(document.getElementById('input-hours').value) || 0;
                const mins = parseInt(document.getElementById('input-minutes').value) || 0;
                totalSeconds = (hrs * 3600) + (mins * 60);
                originalSeconds = totalSeconds;
            }

            if (totalSeconds <= 0) return;

            document.getElementById('timer-inputs').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-pause').classList.remove('hidden');

            isPaused = false;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                totalSeconds--;
                updateTimerDisplay();

                if (totalSeconds <= 0) {
                    completeTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isPaused = true;
            clearInterval(timerInterval);
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-pause').classList.add('hidden');
            document.getElementById('btn-start').innerHTML = '<i class="fas fa-play mr-1"></i> Resume';
        }

        function resetTimer() {
            clearInterval(timerInterval);
            totalSeconds = 0;
            originalSeconds = 0;
            isPaused = false;
            updateTimerDisplay();
            
            document.getElementById('timer-inputs').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-pause').classList.add('hidden');
            document.getElementById('btn-start').innerHTML = '<i class="fas fa-play mr-1"></i> Start';
            
            document.getElementById('input-hours').value = '';
            document.getElementById('input-minutes').value = '';
        }

        function completeTimer() {
            resetTimer(); 
            
            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const h = Math.floor(originalSeconds / 3600);
            const m = Math.floor((originalSeconds % 3600) / 60);
            let durationStr = [];
            if (h > 0) durationStr.push(`${h} hr`);
            if (m > 0) durationStr.push(`${m} min`);
            if (durationStr.length === 0) durationStr.push(`${originalSeconds} sec`);

            timerHistoryData.unshift({
                id: Date.now(),
                date: dateStr,
                time: timeStr,
                duration: durationStr.join(' '),
                status: 'Completed'
            });

            localStorage.setItem('myTimerHistory', JSON.stringify(timerHistoryData));
            renderTimerHistory();

            showNotification(`Timer for ${durationStr.join(' ')} completed!`);
        }

        function renderTimerHistory() {
            const listEl = document.getElementById('timer-history-list');
            listEl.innerHTML = '';
            if (timerHistoryData.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-gray-500 italic text-center mt-4">No completed timers yet.</p>`;
                return;
            }
            
            timerHistoryData.forEach(log => {
                listEl.innerHTML += `
                    <div class="flex flex-col bg-white/5 p-3 rounded-lg border border-white/5 hover:bg-white/10 transition-colors">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-semibold text-green-300">${log.duration}</span>
                            <span class="text-xs text-gray-400">${log.date}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-gray-300"><i class="far fa-clock mr-1"></i> ${log.time}</span>
                            <span class="text-[10px] uppercase tracking-wider bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full"><i class="fas fa-check-circle mr-1"></i>${log.status}</span>
                        </div>
                    </div>
                `;
            });
        }

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.className = "absolute top-6 left-1/2 transform -translate-x-1/2 bg-green-500/90 backdrop-blur border border-green-400 text-white px-5 py-2 rounded-lg shadow-[0_0_15px_rgba(34,197,94,0.5)] z-50 transition-all duration-300";
            notif.innerHTML = `<i class="fas fa-check-circle mr-2"></i>${message}`;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.style.opacity = '0';
                setTimeout(() => notif.remove(), 300);
            }, 3500);
        }

        // Render Chart.js
        function renderChart() {
            const ctx = document.getElementById('historyChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: historyData.map(d => d.date),
                    datasets: [{
                        label: 'Completion %',
                        data: historyData.map(d => d.score),
                        borderColor: '#60a5fa',
                        backgroundColor: 'rgba(96, 165, 250, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#60a5fa',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#94a3b8', stepSize: 25 }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Boot up
        init();
    </script>
